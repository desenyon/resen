name: Verify public installation
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published version tag
        required: true
        default: v0.2.0
permissions:
  contents: read
jobs:
  install:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: macos-15
            name: macos-arm64
          - os: windows-2025
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      RESEN_VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.version }}
          persist-credentials: false
      - name: Download and verify the public release
        shell: bash
        run: python3 scripts/release_qa.py --version "$RESEN_VERSION" --platform '${{ matrix.name }}' --output "$RUNNER_TEMP/resen bin"
      - if: runner.os != 'Windows'
        name: Test the downloaded executable in a terminal
        shell: bash
        run: |
          python3 scripts/pty_qa.py --binary "$RUNNER_TEMP/resen bin/resen"
          python3 scripts/process_qa.py --binary "$RUNNER_TEMP/resen bin/resen"
